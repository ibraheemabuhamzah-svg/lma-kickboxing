name: Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure stable debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LMA KickBoxing, OU=Development, O=LMA, L=Dubai, S=Dubai, C=AE"
            echo "keystore_generated=true" >> "$GITHUB_ENV"
          fi

      - name: Commit generated keystore
        if: env.keystore_generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/debug.keystore
          git commit -m "Add stable debug keystore for consistent APK signing"
          git push

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lma-kickboxing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create/update release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lma-kickboxing-apk
          name: LMA KickBoxing — Android build
          body: Automatically built from the latest commit on main.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
